<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>PokeSearch</h1>
    <div class="input-container">
        <input type="text" class="pokemon-input" placeholder="Enter pokemon name">
        <button class="get-image">Get stats</button>
    </div>
   
    <br>
    <p class="error-message"></p>

    <div class="pokemon-card">
            <img class="pokemon-image" src="">
            <div class="stat">
              <span class="label">HP</span>
              <span class="hp statvalue"></span>
            </div>
        
            <div class="stat">
              <span class="label">Abilities</span>
              <span class="abilities statvalue"></span>
            </div>
        
            <div class="stat">
              <span class="label">Type</span>
              <span class="type statvalue"></span>
            </div>
        
            <div class="stat">
              <span class="label">Speed</span>
              <span class="speed statvalue"></span>
            </div>
        
            <div class="stat">
              <span class="label">Defense</span>
              <span class="defense statvalue"></span>
            </div>
        
            <div class="stat">
              <span class="label">Attack</span>
              <span class="attack statvalue"></span>
            </div>

            <div class="stat">
              <span class="label"> Special Attack</span>
              <span class="special-attack statvalue"></span>
            </div>

            <div class="stat">
              <span class="label">Special Defence</span>
              <span class="special-defense statvalue"></span>
            </div>

            
</div>

    
    <script src="./script.js"></script>
</body>
</html>
